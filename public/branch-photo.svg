<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="DQBC Downtown branch building">
  <rect x="0" y="0" width="320" height="180" fill="#eef2f7"/>
  <!-- Sky -->
  <rect x="0" y="0" width="320" height="110" fill="#dde7f1"/>
  <!-- Building -->
  <rect x="60" y="40" width="200" height="120" fill="#cdb682"/>
  <!-- Columns -->
  <rect x="80" y="70" width="14" height="90" fill="#f3ead2"/>
  <rect x="110" y="70" width="14" height="90" fill="#f3ead2"/>
  <rect x="140" y="70" width="14" height="90" fill="#f3ead2"/>
  <rect x="170" y="70" width="14" height="90" fill="#f3ead2"/>
  <rect x="200" y="70" width="14" height="90" fill="#f3ead2"/>
  <rect x="226" y="70" width="14" height="90" fill="#f3ead2"/>
  <!-- Pediment -->
  <polygon points="60,40 160,10 260,40" fill="#b89865"/>
  <!-- Door -->
  <rect x="146" y="120" width="28" height="40" fill="#5a4422"/>
  <!-- Signage strip -->
  <rect x="86" y="48" width="148" height="18" fill="#1a3a6b"/>
  <text x="160" y="61" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DQBC Downtown</text>
  <!-- Sidewalk -->
  <rect x="0" y="160" width="320" height="20" fill="#bfbfbf"/>
</svg>
